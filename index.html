<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rapor Bulu Tangkis Nolan's Club</title>
<meta name="theme-color" content="#1d5c45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
/* Layout: aplikasi HP satu kolom. Beranda = daftar profil anak; Profil = kartu identitas + ringkasan + catatan; Formulir profil untuk tambah/ubah/hapus. Lapangan hijau + kok gabus. */
:root{
  --bg:#f3f6f2; --surface:#ffffff; --fg:#17251f; --muted:#5d6d65; --line:#d9e2dc;
  --court:#1d5c45; --court-ink:#ffffff; --cork:#c9822b; --cork-soft:#f6e8d4;
  --win:#1f7a4d; --lose:#b5483a; --chip:#e6eee9; --k3:#4a6fa5; --k4:#8a5a9e; --calm:#9fb0a7;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101814; --surface:#18231d; --fg:#e7efea; --muted:#9db0a6; --line:#2a3a32;
  --court:#2f7d5f; --court-ink:#ffffff; --cork:#e2a253; --cork-soft:#3a2d1c;
  --win:#5cc28c; --lose:#e57b6c; --chip:#22312a; --k3:#7f9fd1; --k4:#b98ccc; --calm:#5f7268; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101814; --surface:#18231d; --fg:#e7efea; --muted:#9db0a6; --line:#2a3a32;
  --court:#2f7d5f; --court-ink:#ffffff; --cork:#e2a253; --cork-soft:#3a2d1c;
  --win:#5cc28c; --lose:#e57b6c; --chip:#22312a; --k3:#7f9fd1; --k4:#b98ccc; --calm:#5f7268; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg)}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:620px;margin:0 auto;padding:0 16px;padding-block:0 48px}
header.top{background:var(--court);color:var(--court-ink);margin:0 -16px;padding:18px 16px 18px;position:relative;overflow:hidden}
header.top::after{content:"";position:absolute;left:16px;right:16px;bottom:8px;height:2px;background:rgba(255,255,255,.35)}
header.top::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;background:rgba(255,255,255,.16)}
.toprow{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.back{background:rgba(255,255,255,.15);color:var(--court-ink);border:0;border-radius:999px;padding:6px 12px;font:700 .85rem var(--body);cursor:pointer}
h1{font-family:var(--display);font-weight:700;font-size:1.9rem;letter-spacing:.02em;margin:0;line-height:1.05;text-transform:uppercase;text-wrap:balance}
.sub{opacity:.85;font-size:.9rem;margin:4px 0 0;position:relative}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.card:focus-visible{outline:3px solid var(--cork);outline-offset:2px}
section{margin-top:22px}
h2{font-family:var(--display);font-weight:600;font-size:1.25rem;letter-spacing:.06em;text-transform:uppercase;margin:0 0 10px;color:var(--court)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.hint{color:var(--muted);font-size:.85rem;margin:6px 0 0}
.empty{border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted);text-align:center}

/* Beranda */
.cards{display:grid;gap:10px}
.card{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:left;width:100%;color:var(--fg);font:inherit;cursor:pointer}
.card:hover{border-color:var(--court)}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--court);color:var(--court-ink);display:flex;align-items:center;justify-content:center;font:700 1.6rem var(--display);overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.card .nm{font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.card .meta{color:var(--muted);font-size:.84rem}
.card .nums{display:flex;gap:12px;margin-top:4px;font-size:.82rem}
.card .nums b{font-family:var(--display);font-size:1.1rem;font-variant-numeric:tabular-nums;margin-right:3px}
.card .go{color:var(--muted);font-size:1.3rem}
.addcard{border:2px dashed var(--court);background:transparent;color:var(--court);border-radius:14px;padding:14px;font:700 1rem var(--body);cursor:pointer;width:100%}

/* Profil */
.idcard{display:grid;grid-template-columns:84px 1fr;gap:14px;align-items:center;margin-top:16px;position:relative;z-index:1}
.idcard .avatar{width:84px;height:84px;font-size:2.2rem;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.8)}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.fact{background:rgba(255,255,255,.16);border-radius:999px;padding:2px 10px;font-size:.8rem}
.editbtn{margin-top:10px;background:var(--court-ink);color:var(--court);border:0;border-radius:8px;padding:6px 12px;font:700 .82rem var(--body);cursor:pointer}
.goal{background:var(--cork-soft);border-radius:10px;padding:10px 12px;margin-top:14px;font-size:.92rem}
.goal b{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--cork)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:1.8rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);letter-spacing:.03em}
.chart{width:100%;height:auto;display:block}
.skills{display:grid;gap:8px}
.skill{display:grid;grid-template-columns:7.5rem 1fr 3.4rem;align-items:center;gap:8px;font-size:.9rem}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--court);border-radius:6px}
.delta{font-size:.8rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.delta.up{color:var(--win)}.delta.down{color:var(--lose)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:8px;padding:7px 12px;font:600 .88rem var(--body);cursor:pointer}
.tab[aria-selected="true"]{background:var(--cork);border-color:var(--cork);color:#fff}

/* Formulir */
form{display:grid;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:grid;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted);min-width:0}
input,select,textarea{font:400 .95rem var(--body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:64px;resize:vertical}
.req{color:var(--lose)}
.rate{display:grid;grid-template-columns:7.5rem 1fr;align-items:center;gap:8px;font-size:.9rem;color:var(--fg);font-weight:400}
.dots{display:flex;gap:6px}
.dots button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:700 .85rem var(--body);cursor:pointer}
.dots button.on{background:var(--court);color:var(--court-ink);border-color:var(--court)}
.primary{background:var(--court);color:var(--court-ink);border:0;border-radius:10px;padding:12px;font:700 1rem var(--body);cursor:pointer}
.primary:disabled{opacity:.55;cursor:default}
.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:11px;font:700 .95rem var(--body);cursor:pointer}
.danger{background:transparent;color:var(--lose);border:1px solid var(--lose);border-radius:10px;padding:11px;font:700 .95rem var(--body);cursor:pointer}
.danger.solid{background:var(--lose);color:#fff}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dz{border-top:1px solid var(--line);padding-top:14px;margin-top:6px;display:grid;gap:8px}
.dz p{margin:0;font-size:.88rem}
.msg{font-size:.86rem;min-height:1.2em;margin:8px 0 0}
.msg.err{color:var(--lose)}
.who-bar{display:flex;justify-content:flex-end;gap:8px;align-items:center;position:relative;z-index:1;margin-bottom:6px;font-size:.8rem}
.who-bar span{opacity:.85}
.who-bar button{background:rgba(255,255,255,.15);color:var(--court-ink);border:0;border-radius:999px;padding:5px 12px;font:700 .8rem var(--body);cursor:pointer}
.busy{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);border-radius:999px;padding:8px 16px;font-size:.85rem;z-index:60}
.avpick{display:flex;align-items:center;gap:12px}
.avpick .avatar{width:72px;height:72px}
.photos{display:grid;gap:6px}
.pick{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pickbtn{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--court);color:var(--court);background:transparent;border-radius:8px;padding:8px 12px;font:700 .88rem var(--body);cursor:pointer}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{position:relative;width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--chip);padding:0;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font:700 .8rem var(--body);cursor:pointer;line-height:22px;padding:0}

/* Riwayat */
.filter{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:4px}
.item .head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.item .kind{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.item .date{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.item .title{font-weight:700;min-width:0;overflow-wrap:anywhere}
.item p{margin:0;overflow-wrap:anywhere}
.score{font-family:var(--display);font-size:1.15rem;letter-spacing:.03em;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.04em}
.pill.win{background:var(--win);color:#fff}.pill.lose{background:var(--lose);color:#fff}
.pill.ex{background:var(--cork-soft);color:var(--cork)}
.pill.mood{background:var(--chip);color:var(--fg)}
.gallery{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.gallery .thumb{width:84px;height:84px}
.del{justify-self:end;background:none;border:0;color:var(--muted);font:600 .8rem var(--body);cursor:pointer;padding:4px}
.del.arm{color:var(--lose)}
.exbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--cork-soft);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:.88rem;margin-top:14px;flex-wrap:wrap}
.exbar button{background:none;border:1px solid var(--cork);color:var(--cork);border-radius:8px;padding:6px 10px;font:700 .82rem var(--body);cursor:pointer}
.lb{position:fixed;inset:0;background:rgba(5,12,9,.92);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.lb img{max-width:100%;max-height:85vh;border-radius:8px}
.lb button{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:#fff;color:#17251f;border:0;border-radius:999px;padding:8px 14px;font:700 .9rem var(--body);cursor:pointer}
/* Dasbor */
.nav{display:flex;gap:4px;background:rgba(0,0,0,.18);border-radius:10px;padding:4px;margin-top:14px;position:relative;z-index:1;width:max-content;max-width:100%;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{background:transparent;color:var(--court-ink);border:0;border-radius:7px;padding:7px 12px;font:700 .88rem var(--body);cursor:pointer;opacity:.85;white-space:nowrap;flex:none}
.nav button[aria-current="page"]{background:var(--court-ink);color:var(--court);opacity:1}
.range{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tile b{display:block;font-family:var(--display);font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:.8rem;color:var(--muted)}
.tile small{display:block;font-size:.76rem;color:var(--muted);margin-top:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.kcards{display:grid;gap:8px}
.kc{display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--kc,var(--court));border-radius:10px;padding:10px 12px;text-align:left;width:100%;color:var(--fg);font:inherit;cursor:pointer}
.kc .avatar{width:44px;height:44px;font-size:1.1rem}
.kc .nm{font-weight:700}
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 12px;font-size:.83rem;margin-top:4px}
.kgrid span{color:var(--muted)}
.kgrid b{color:var(--fg);font-variant-numeric:tabular-nums}
.moods{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:6.5rem 1fr;gap:8px;align-items:center;font-size:.86rem}
.mbar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--chip)}
.mbar i{display:block;height:100%}
.alert{background:var(--cork-soft);border-radius:10px;padding:10px 12px;font-size:.88rem;margin-top:10px}
.feed{display:grid;gap:6px}
.fi{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;font-size:.88rem;padding:8px 0;border-bottom:1px solid var(--line)}
.fi:last-child{border-bottom:0}
.fi .who{font-weight:700}
.fi .what{min-width:0;overflow-wrap:anywhere;color:var(--fg)}
.fi .when{color:var(--muted);font-size:.78rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.tg{display:grid;gap:8px}
.tg div{font-size:.9rem}
.tg b{display:block;font-size:.78rem;color:var(--muted)}
/* Laporan */
.opts{display:grid;gap:10px}
.checks{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem}
.checks label{display:flex;flex-direction:row;align-items:center;gap:6px;color:var(--fg);font-weight:600}
.checks input{width:auto}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.08);padding:22px 20px;font-size:.88rem;line-height:1.45}
.paper .rhead{border-bottom:3px solid var(--court);padding-bottom:10px;margin-bottom:14px}
.paper .rhead h3{font-family:var(--display);font-size:1.5rem;text-transform:uppercase;letter-spacing:.03em;margin:0;color:var(--court)}
.paper .rhead p{margin:2px 0 0;color:var(--muted);font-size:.8rem}
.paper h4{font-family:var(--display);font-size:1.15rem;text-transform:uppercase;letter-spacing:.04em;margin:18px 0 6px;color:var(--fg)}
.paper h5{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 4px}
.rt{width:100%;border-collapse:collapse;font-size:.82rem;font-variant-numeric:tabular-nums}
.rt th,.rt td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.rt th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.rt td.n,.rt th.n{text-align:right}
.rt tr.tot td{font-weight:700;border-top:2px solid var(--fg)}
.tw{overflow-x:auto}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px 12px;margin:4px 0}
.kv div{border-left:3px solid var(--court);padding-left:8px}
.kv b{display:block;font-size:1.05rem;font-variant-numeric:tabular-nums}
.kv span{font-size:.74rem;color:var(--muted)}
.paper .note{color:var(--muted);font-size:.8rem;margin:4px 0}
.dlrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* Pengeluaran */
.monthbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:16px}
.monthbar b{font-family:var(--display);font-size:1.35rem;letter-spacing:.03em;text-transform:uppercase}
.mbtn{background:var(--surface);border:1px solid var(--line);color:var(--fg);border-radius:8px;width:40px;height:36px;font:700 1.1rem var(--body);cursor:pointer}
.mbtn:disabled{opacity:.4;cursor:default}
.money{font-variant-numeric:tabular-nums}
.tile.big b{font-size:1.55rem}
.cats{display:grid;gap:8px}
.cat{display:grid;grid-template-columns:8.5rem 1fr 6.5rem;gap:8px;align-items:center;font-size:.88rem}
.cat .amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.cat .bar i{background:var(--cork)}
.xitem{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.xitem .xamt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.xitem .xmeta{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.8rem;color:var(--muted)}
.xitem .xtitle{font-weight:700;min-width:0;overflow-wrap:anywhere}
.xitem .xact{grid-column:1/-1;display:flex;gap:4px;justify-content:flex-end}
.xitem .xact button{background:none;border:0;color:var(--muted);font:600 .8rem var(--body);cursor:pointer;padding:4px 6px}
.xitem .xact button.arm{color:var(--lose)}
.xitem .thumb{width:56px;height:56px}
.private{display:inline-flex;gap:6px;align-items:center;font-size:.8rem;color:var(--muted);margin-top:8px}
@media (max-width:420px){.cat{grid-template-columns:6.8rem 1fr 5.6rem;font-size:.82rem}}
@media (max-width:420px){.row{grid-template-columns:1fr}.skill{grid-template-columns:6.4rem 1fr 3.2rem}.rate{grid-template-columns:6.4rem 1fr}.dots button{width:30px;height:30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <header class="top" id="top"></header>
  <main id="view"><div class="empty" style="margin-top:20px">Memuat…</div></main>
</div>

<div class="lb" id="lb" hidden><button type="button" id="lbClose">Tutup</button><img id="lbImg" alt="Foto"></div>

<script>
(function(){
const SKILLS=[["footwork","Footwork"],["servis","Servis"],["clear","Lob / Clear"],["smash","Smash"],["netting","Netting"],["defend","Bertahan"]];
const TYPES=[["train","Latihan"],["coach","Masukan Pelatih"],["skill","Nilai Keterampilan"],["run","Lari"],["fisik","Tinggi & Berat"],["match","Pertandingan"]];
const fmt1=v=>(+v).toLocaleString("id-ID",{maximumFractionDigits:1});
const sgn=v=>(v>0?"+":v<0?"−":"±")+fmt1(Math.abs(v));
const num=s=>{const v=parseFloat(String(s||"").replace(",","."));return isFinite(v)?v:0};
function parseDur(s){s=String(s||"").trim();if(!s)return 0;const p=s.split(/[:.]/).map(x=>parseInt(x,10));if(p.some(isNaN))return 0;
  return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0]*60}
const fmtDur=t=>{t=Math.round(t);const h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0")};
const paceOf=e=>e.jarak>0&&e.detik>0?e.detik/e.jarak:0;
const fmtKm=k=>(+k).toLocaleString("id-ID",{maximumFractionDigits:2});
const MAXP=4, YEAR=new Date().getFullYear();
const db=true, assets=true;
let role="tamu", pin="", writable=false, ready=false, isOwner=false, loadErr="";
try{pin=localStorage.getItem("rbt-pin")||""}catch(e){}
let dashRange=90;
let kids={}, entries=[], view={name:"dash"}, type="train", hfilter="all", ratings={}, pending=[], avatarPending=null, avatarRemove=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const okId=id=>typeof id==="string"&&/^[A-Za-z0-9_-]{20,}$/.test(id);
const fotoUrl=(id,w)=>`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w${w||1200}`;
const api=(fn,...a)=>{const u=(typeof APP_URL==="string"?APP_URL:"").trim();
  if(!/^https:\/\/script\.google\.com\/.+\/exec/.test(u))return Promise.reject(new Error("Alamat aplikasi belum diisi di config.js."));
  if(!navigator.onLine)return Promise.reject(new Error("Tidak ada internet. Coba lagi setelah tersambung."));
  const ujung=" (alamat ..."+u.slice(-10)+")";
  const body=JSON.stringify(a);
  const lewatGet=body.length<1800;
  const req=lewatGet?fetch(u+"?fn="+encodeURIComponent(fn)+"&args="+encodeURIComponent(body)+"&_="+Date.now(),{redirect:"follow"})
    :fetch(u,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:fn,args:a}),redirect:"follow"});
  return req.then(r=>{if(!r.ok)throw new Error("Server menjawab "+r.status+ujung+".");
      return r.text().then(t=>{try{return JSON.parse(t)}catch(x){throw new Error("Jawaban Google bukan data"+ujung+": "+t.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim().slice(0,120))}})},
    e=>{throw new Error((lewatGet?"Tidak bisa terhubung ke Google":"Foto tidak bisa dikirim ke Google")+ujung+"; "+((e&&e.message)||e)+".")})
  .then(o=>{if(!o||!o.ok)throw new Error((o&&o.error)||"Terjadi kesalahan.");return o.data})};
const errText=e=>(e&&e.message?String(e.message).replace(/^Exception:\s*/,""):"Terjadi kesalahan. Coba lagi.");
function busy(on,t){const b=$("busy");if(!b)return;b.textContent=t||"Menyimpan…";b.hidden=!on}
function applyData(d){kids={};(d.anak||[]).forEach(k=>kids[k.id]=k);entries=d.catatan||[];biaya=d.pengeluaran||[];role=d.peran||"tamu";isOwner=role==="pemilik";writable=role!=="tamu";ready=true}
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const fmtDate=s=>{try{return new Date(s+"T00:00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})}catch(e){return s||""}};
const fmtMonth=s=>{try{return new Date(s+"-01T00:00:00").toLocaleDateString("id-ID",{month:"long",year:"numeric"})}catch(e){return s||""}};
const initials=n=>String(n||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const avatarHTML=k=>okId(k.foto)?`<span class="avatar"><img src="${fotoUrl(k.foto,300)}" alt="" referrerpolicy="no-referrer"></span>`:`<span class="avatar">${esc(initials(k.nama))}</span>`;
const sortedKids=()=>Object.entries(kids).sort((a,b)=>(+a[1].lahir||9999)-(+b[1].lahir||9999)||(a[1].dibuat||0)-(b[1].dibuat||0));
const of=id=>entries.filter(e=>e.anak===id);

function parseSets(str){const s=[];String(str||"").split(/[,;]/).forEach(p=>{const m=p.match(/(\d+)\s*[-–:]\s*(\d+)/);if(m)s.push([+m[1],+m[2]])});return s}
function matchInfo(e){const s=parseSets(e.skor);let w=0,l=0,me=0,op=0;s.forEach(([a,b])=>{me+=a;op+=b;a>b?w++:l++});return{sets:s,w,l,gap:me-op,won:s.length?w>l:null}}
function showMsg(t,err){const m=$("msg");if(!m)return;m.textContent=t;m.className="msg"+(err?" err":"");if(!err)setTimeout(()=>{if(m.textContent===t)m.textContent=""},3000)}
function shrink(file,max){return new Promise(res=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b||file),"image/jpeg",0.82)};
  img.onerror=()=>{URL.revokeObjectURL(u);res(file)};img.src=u})}
async function upload(file,max){const b=await shrink(file,max);const d=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(b)});return {data:d}}
function uploadErr(err){return "Foto tidak bisa dibaca. Pilih foto lain."}
async function dropAssets(){}
function whoBar(){return `<div class="who-bar">${role==="pemilik"?"<span>Masuk sebagai pemilik</span>":role==="pengisi"?"<span>Masuk sebagai pengisi</span>":""}<button type="button" id="whoBtn">${role==="tamu"?"Masuk dengan PIN":"Keluar"}</button></div>`}
function bindWho(){const b=$("whoBtn");if(!b)return;b.onclick=()=>{if(role==="tamu")go({name:"login"});else{pin="";try{localStorage.removeItem("rbt-pin")}catch(e){}role="tamu";isOwner=false;writable=false;refresh()}}}
function go(v){view=v;try{localStorage.setItem("rbt-view",JSON.stringify(v.name==="kidform"||v.name==="login"?{name:"dash"}:v))}catch(e){}render();window.scrollTo(0,0)}
function renderLogin(){
  $("top").innerHTML=`<div class="toprow"><button type="button" class="back" id="back">‹ Kembali</button></div><h1 style="margin-top:12px">Masuk</h1><p class="sub">Masukkan PIN dari pemilik aplikasi.</p>`;
  $("back").onclick=()=>go({name:"dash"});
  $("view").innerHTML=`<section><div class="panel"><form id="lform" novalidate><label>PIN<input id="l-pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="20"></label><button class="primary" type="submit" id="lBtn">Masuk</button></form><p class="msg" id="msg" role="status"></p>
    <p class="hint">PIN pemilik bisa mengelola profil anak. PIN pengisi bisa menambah catatan. Tanpa PIN, aplikasi tetap bisa dilihat.</p></div></section>`;
  $("l-pin").focus();
  $("lform").onsubmit=async ev=>{ev.preventDefault();const p=$("l-pin").value.trim();if(!p){showMsg("Isi PIN dulu.",true);return}
    const b=$("lBtn");b.disabled=true;b.textContent="Memeriksa…";
    try{const d=await api("ambilData",p);if(d.peran==="tamu"){b.disabled=false;b.textContent="Masuk";showMsg("PIN tidak dikenali.",true);return}
      pin=p;try{localStorage.setItem("rbt-pin",p)}catch(e){}applyData(d);go({name:"dash"})}
    catch(e){b.disabled=false;b.textContent="Masuk";showMsg(errText(e),true)}}
}
function navHTML(a){return `<nav class="nav" aria-label="Menu utama"><button type="button" data-v="dash"${a==="dash"?' aria-current="page"':""}>Dasbor</button><button type="button" data-v="home"${a==="home"?' aria-current="page"':""}>Profil Anak</button>${isOwner?`<button type="button" data-v="biaya"${a==="biaya"?' aria-current="page"':""}>Pengeluaran</button>`:""}<button type="button" data-v="lap"${a==="lap"?' aria-current="page"':""}>Laporan</button></nav>`}
function bindNav(){$("top").querySelectorAll(".nav button").forEach(b=>b.onclick=()=>go({name:b.dataset.v}))}
const KCOL=["var(--court)","var(--cork)","var(--k3)","var(--k4)"];
function kidColor(id){const i=sortedKids().findIndex(([k])=>k===id);return KCOL[(i<0?0:i)%KCOL.length]}

/* ---------- Dasbor ---------- */
function inRange(e){if(!dashRange)return true;const d=new Date((e.tanggal||"")+"T00:00:00");return (Date.now()-d.getTime())/864e5<=dashRange}
function renderDash(){
  $("top").innerHTML=`${whoBar()}<h1>Rapor Bulu Tangkis Nolan's Club</h1><p class="sub">Gambaran perkembangan semua anak.</p>${navHTML("dash")}`;bindNav();bindWho();
  if(loadErr){$("view").innerHTML=`<section><div class="empty">${esc(loadErr)}</div></section>`;return}
  if(!ready){$("view").innerHTML=`<div class="empty" style="margin-top:20px">Memuat dasbor…</div>`;return}
  const ks=sortedKids();
  if(!ks.length){$("view").innerHTML=`<section><div class="empty">Belum ada profil anak.${isOwner?" Tambahkan lewat menu <b>Profil Anak</b>.":""}</div></section>`;return}
  const E=entries.filter(e=>kids[e.anak]&&inRange(e));
  const tr=E.filter(e=>e.jenis==="train"),ma=E.filter(e=>e.jenis==="match"),co=E.filter(e=>e.jenis==="coach"),ru=E.filter(e=>e.jenis==="run");
  const km=ru.reduce((a,e)=>a+(+e.jarak||0),0);
  let sw=0,sl=0;ma.forEach(e=>{const i=matchInfo(e);sw+=i.w;sl+=i.l});
  const ph=E.reduce((n,e)=>n+(Array.isArray(e.foto)?e.foto.length:0),0);
  const rl=dashRange===30?"30 hari terakhir":dashRange===90?"3 bulan terakhir":"sejak awal";
  let h=`<div class="range" role="group" aria-label="Periode">${[[30,"30 hari"],[90,"3 bulan"],[0,"Semua"]].map(([v,n])=>`<button type="button" class="tab" data-r="${v}" aria-selected="${v===dashRange}">${n}</button>`).join("")}</div>
  <section style="margin-top:14px"><h2>Ringkasan · ${rl}</h2><div class="tiles">
    <div class="tile"><b>${tr.length}</b><span>Catatan latihan</span></div>
    <div class="tile"><b>${co.length}</b><span>Masukan pelatih</span></div>
    <div class="tile"><b>${ma.length}</b><span>Pertandingan</span><small>${sw} set menang · ${sl} set kalah</small></div>
    <div class="tile"><b>${ru.length}</b><span>Sesi lari</span><small>Total ${fmtKm(km)} km</small></div>
    <div class="tile"><b>${E.filter(e=>e.jenis==="skill").length}</b><span>Penilaian keterampilan</span></div>
    <div class="tile"><b>${ph}</b><span>Foto momen</span></div>
    ${isOwner?(()=>{const mk=today().slice(0,7),t=biaya.filter(x=>(x.tanggal||"").startsWith(mk)).reduce((a,x)=>a+(+x.jumlah||0),0);return `<div class="tile" style="grid-column:1/-1"><b class="money" style="font-size:1.5rem">${rp(t)}</b><span>Pengeluaran bulan ini · hanya terlihat oleh Anda</span></div>`})():""}</div></section>`;

  /* aktivitas per minggu */
  const nW=dashRange===30?5:dashRange===90?13:16,now=new Date();now.setHours(0,0,0,0);
  const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
  const weeks=[];for(let i=nW-1;i>=0;i--){const s=new Date(mon);s.setDate(mon.getDate()-7*i);weeks.push(s)}
  const cnt=weeks.map(()=>({}));
  entries.filter(e=>kids[e.anak]).forEach(e=>{const d=new Date((e.tanggal||"")+"T00:00:00");for(let i=weeks.length-1;i>=0;i--){if(d>=weeks[i]){const n=new Date(weeks[i]);n.setDate(n.getDate()+7);if(d<n)cnt[i][e.anak]=(cnt[i][e.anak]||0)+1;break}}});
  const tot=cnt.map(c=>Object.values(c).reduce((a,b)=>a+b,0));let mx=Math.max(4,...tot);mx=Math.ceil(mx/2)*2;
  const W=340,H=170,L=26,R=6,T=10,B=24,pw=W-L-R,ph2=H-T-B,bw=Math.max(6,Math.min(22,pw/nW*0.62));
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Jumlah catatan per minggu">`;
  [0,mx/2,mx].forEach(v=>{const y=T+ph2-(v/mx)*ph2;g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-5}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="Nunito Sans,system-ui">${v}</text>`});
  weeks.forEach((w,i)=>{const cx=L+pw*(i+.5)/nW;let y=T+ph2;
    ks.forEach(([id])=>{const c=cnt[i][id]||0;if(!c)return;const hh=c/mx*ph2;y-=hh;g+=`<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${hh}" fill="${kidColor(id)}"><title>${esc(kids[id].nama)}: ${c} catatan</title></rect>`});
    if(i%Math.ceil(nW/6)===0||i===nW-1)g+=`<text x="${cx}" y="${H-7}" text-anchor="middle" font-size="9.5" fill="var(--muted)" font-family="Nunito Sans,system-ui">${w.getDate()}/${w.getMonth()+1}</text>`});
  g+="</svg>";
  h+=`<section><h2>Aktivitas per Minggu</h2><div class="panel">${g}<div class="legend">${ks.map(([id,k])=>`<span><i style="background:${kidColor(id)}"></i>${esc(k.nama)}</span>`).join("")}</div>
    <p class="hint">Jumlah semua catatan tiap minggu (tanggal = awal minggu, Senin).</p></div></section>`;

  /* kartu per anak */
  h+=`<section><h2>Per Anak</h2><div class="kcards">${ks.map(([id,k])=>{
    const m=E.filter(e=>e.anak===id),mt=m.filter(e=>e.jenis==="match").sort((a,b)=>(a.tanggal||"").localeCompare(b.tanggal||""));
    let mw=0,ml=0;mt.forEach(e=>{const i=matchInfo(e);if(i.won===true)mw++;else if(i.won===false)ml++});
    const gaps=mt.map(e=>matchInfo(e)).filter(i=>i.sets.length).map(i=>Math.round(i.gap/i.sets.length));
    const gapTxt=gaps.length>=2?`${gaps[0]>0?"+":""}${gaps[0]} → ${gaps[gaps.length-1]>0?"+":""}${gaps[gaps.length-1]}`:gaps.length?`${gaps[0]>0?"+":""}${gaps[0]}`:"–";
    const sk=entries.filter(e=>e.anak===id&&e.jenis==="skill").sort((a,b)=>(b.tanggal||"").localeCompare(a.tanggal||""));
    const avg=n=>{const v=Object.values(n||{}).map(Number).filter(Boolean);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0};
    const a1=sk[0]?avg(sk[0].nilai):0,a0=sk[1]?avg(sk[1].nilai):0;
    const skTxt=a1?`${a1.toFixed(1)}/5${a0?` ${a1>a0?"▲":a1<a0?"▼":"="}`:""}`:"–";
    const lt=entries.filter(e=>e.anak===id&&e.jenis==="train").sort((a,b)=>(b.tanggal||"").localeCompare(a.tanggal||""))[0];
    return `<button type="button" class="kc" data-id="${esc(id)}" style="--kc:${kidColor(id)}">${avatarHTML(k)}<span style="min-width:0"><span class="nm">${esc(k.nama)}</span>
      <span class="kgrid"><span>Latihan</span><b>${m.filter(e=>e.jenis==="train").length}×</b>
      <span>Pertandingan</span><b>${mt.length?`${mw} M · ${ml} K`:"–"}</b>
      <span>Selisih poin/set</span><b>${gapTxt}</b>
      <span>Rata-rata keterampilan</span><b>${skTxt}</b>
      <span>Tinggi / berat</span><b>${(()=>{const f=entries.filter(e=>e.anak===id&&e.jenis==="fisik").sort((a,b)=>(b.tanggal||"").localeCompare(a.tanggal||""));const t=f.find(e=>e.tinggi),w=f.find(e=>e.berat);return t||w?(t?fmt1(t.tinggi)+" cm":"–")+" · "+(w?fmt1(w.berat)+" kg":"–"):"–"})()}</b>
      <span>Lari terakhir</span><b>${(()=>{const r=entries.filter(e=>e.anak===id&&e.jenis==="run").sort((a,b)=>(b.tanggal||"").localeCompare(a.tanggal||""))[0];return r?`${fmtKm(r.jarak)} km${paceOf(r)?` · ${fmtDur(paceOf(r))}/km`:""}`:"–"})()}</b>
      <span>Suasana terakhir</span><b>${lt&&lt.mood?esc(lt.mood):"–"}</b></span></span></button>`}).join("")}</div>
    <p class="hint">Selisih poin per set dari pertandingan pertama ke terakhir dalam periode ini. Makin mendekati nol berarti makin seimbang dengan lawan.</p></section>`;

  /* suasana hati */
  const MO=[["Semangat","var(--win)"],["Biasa","var(--calm)"],["Lelah","var(--cork)"],["Malas","var(--lose)"]];
  const warn=[];
  const rows=ks.map(([id,k])=>{const t=tr.filter(e=>e.anak===id&&e.mood);if(!t.length)return `<div class="mrow"><span>${esc(k.nama)}</span><span class="hint" style="margin:0">Belum ada data</span></div>`;
    const c={};t.forEach(e=>c[e.mood]=(c[e.mood]||0)+1);const bad=(c.Lelah||0)+(c.Malas||0);if(t.length>=3&&bad/t.length>=.4)warn.push(k.nama);
    return `<div class="mrow"><span>${esc(k.nama)}</span><span class="mbar" role="img" aria-label="${MO.map(([n])=>c[n]?`${n} ${c[n]}`:"").filter(Boolean).join(", ")}">${MO.map(([n,col])=>c[n]?`<i style="width:${c[n]/t.length*100}%;background:${col}" title="${n}: ${c[n]}"></i>`:"").join("")}</span></div>`}).join("");
  h+=`<section><h2>Suasana Hati Saat Latihan</h2><div class="panel"><div class="moods">${rows}</div>
    <div class="legend">${MO.map(([n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join("")}</div>
    ${warn.length?`<div class="alert"><b>Perlu diperhatikan:</b> ${warn.map(esc).join(", ")} cukup sering lelah atau malas belakangan ini. Mungkin perlu hari istirahat atau obrolan santai dengan pelatih.</div>`:""}</div></section>`;

  /* target pelatih */
  const tg=ks.map(([id,k])=>{const c=entries.filter(e=>e.anak===id&&e.jenis==="coach"&&e.target).sort((a,b)=>(b.tanggal||"").localeCompare(a.tanggal||""))[0];
    return c?`<div><b>${esc(k.nama)} · ${fmtDate(c.tanggal)}</b>${esc(c.target)}</div>`:""}).filter(Boolean);
  h+=`<section><h2>Target dari Pelatih</h2><div class="panel">${tg.length?`<div class="tg">${tg.join("")}</div>`:`<div class="empty">Belum ada target. Isi lewat catatan <b>Masukan Pelatih</b>.</div>`}</div></section>`;

  /* aktivitas terbaru */
  const rec=entries.filter(e=>kids[e.anak]).sort((a,b)=>(b.tanggal||"").localeCompare(a.tanggal||"")||(b.dibuat||0)-(a.dibuat||0)).slice(0,6);
  const what=e=>e.jenis==="match"?`${esc(e.turnamen||"Pertandingan")} · ${parseSets(e.skor).map(s=>s.join("–")).join(", ")}`:e.jenis==="train"?`Latihan: ${esc(e.fokus||e.catatan||"")}`:e.jenis==="coach"?`Pelatih: ${esc(e.masukan)}`:e.jenis==="run"?`Lari ${fmtKm(e.jarak)} km${e.detik?` dalam ${fmtDur(e.detik)}`:""}`:"Nilai keterampilan diperbarui";
  h+=`<section><h2>Catatan Terbaru</h2><div class="panel">${rec.length?`<div class="feed">${rec.map(e=>`<div class="fi"><span class="who" style="color:${kidColor(e.anak)}">${esc(kids[e.anak].nama)}</span><span class="what">${what(e)}</span><span class="when">${fmtDate(e.tanggal)}</span></div>`).join("")}</div>`:`<div class="empty">Belum ada catatan.</div>`}</div></section>`;

  $("view").innerHTML=h;
  $("view").querySelectorAll(".range .tab").forEach(b=>b.onclick=()=>{dashRange=+b.dataset.r;renderDash()});
  $("view").querySelectorAll(".kc").forEach(b=>b.onclick=()=>go({name:"kid",id:b.dataset.id}));
}

/* ---------- Lightbox ---------- */
function openLb(src){$("lbImg").referrerPolicy="no-referrer";$("lbImg").src=src;$("lb").hidden=false;$("lbClose").focus()}
$("lbClose").onclick=()=>{$("lb").hidden=true;$("lbImg").src=""};
$("lb").onclick=ev=>{if(ev.target.id==="lb")$("lbClose").click()};
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"&&!$("lb").hidden)$("lbClose").click()});

/* ---------- Router ---------- */
function render(){
  if(view.name==="kid"&&!kids[view.id]){
    if(!ready){$("top").innerHTML=`<h1>Rapor Bulu Tangkis Nolan's Club</h1>`;$("view").innerHTML=`<div class="empty" style="margin-top:20px">Memuat profil…</div>`;return}
    view={name:"home"}}
  if(view.name==="kidform"&&!isOwner)view={name:"home"};
  if(view.name==="biaya"&&ready&&!isOwner)view={name:"dash"};
  if(view.name==="login")return renderLogin();
  if(view.name==="lap")renderLap();else if(view.name==="biaya")renderBiaya();else if(view.name==="dash")renderDash();else if(view.name==="home")renderHome();else if(view.name==="kid")renderKid();else renderKidForm();
}

/* ---------- Beranda ---------- */
function renderHome(){
  $("top").innerHTML=`${whoBar()}<h1>Rapor Bulu Tangkis Nolan's Club</h1><p class="sub">Catatan perkembangan anak, diisi tiap akhir pekan.</p>${navHTML("home")}`;bindNav();bindWho();
  const list=sortedKids();
  const ex=isOwner&&entries.some(e=>e.contoh);
  const role=ready&&db?`<p class="hint" style="margin-top:14px">${isOwner?"Anda pemilik: bisa mengelola profil dan semua catatan.":writable?"Anda bisa melihat profil dan menambah catatan. Profil hanya bisa diubah oleh pemilik.":"Anda sedang melihat. Masuk dengan PIN untuk menambah catatan."}</p>`:"";
  $("view").innerHTML=`${role}${ex?exbarHTML():""}<section><h2>Profil Anak</h2><div class="cards" id="cards">${
    !ready?`<div class="empty">Memuat profil…</div>`:
    list.length?list.map(([id,k])=>{const m=of(id);const nm=m.filter(e=>e.jenis==="match").length,nt=m.filter(e=>e.jenis==="train").length;
      const last=m.map(e=>e.tanggal||"").sort().pop();

function lineChart(pts,fmt,label,unit){
  const W=340,H=150,L=40,R=12,T=12,B=24,pw=W-L-R,ph=H-T-B;
  const vs=pts.map(p=>p.v);let lo=Math.min(...vs),hi=Math.max(...vs);const pad=Math.max((hi-lo)*.2,unit);lo=Math.floor((lo-pad)/unit)*unit;hi=Math.ceil((hi+pad)/unit)*unit;
  const ts=pts.map(p=>new Date(p.t+"T00:00:00").getTime()),t0=Math.min(...ts),t1=Math.max(...ts);
  const x=i=>pts.length===1?L+pw/2:L+pw*(ts[i]-t0)/((t1-t0)||1),y=v=>T+ph-(v-lo)/((hi-lo)||1)*ph;
  let g=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">`;
  [lo,(lo+hi)/2,hi].forEach(v=>{g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="Nunito Sans,system-ui">${fmt(v)}</text>`});
  if(pts.length>1)g+=`<polyline fill="none" stroke="var(--court)" stroke-width="2.5" stroke-linejoin="round" points="${pts.map((p,i)=>x(i)+","+y(p.v)).join(" ")}"/>`;
  pts.forEach((p,i)=>{const last=i===pts.length-1;g+=`<circle cx="${x(i)}" cy="${y(p.v)}" r="${last?5:3.5}" fill="${last?"var(--cork)":"var(--court)"}"><title>${fmtDate(p.t)}: ${fmt(p.v)}</title></circle>`;
    if(i===0||last||pts.length<=5){const d=new Date(p.t+"T00:00:00");g+=`<text x="${x(i)}" y="${H-7}" text-anchor="${pts.length>1?(i===0?"start":last?"end":"middle"):"middle"}" font-size="9.5" fill="var(--muted)" font-family="Nunito Sans,system-ui">${d.toLocaleDateString("id-ID",{month:"short",year:"2-digit"})}</text>`}});
  return g+"</svg>";
}
function growInfo(list){

  const T=f.filter(e=>+e.tinggi>0).map(e=>({t:e.tanggal,v:+e.tinggi})),W=f.filter(e=>+e.berat>0).map(e=>({t:e.tanggal,v:+e.berat}));
  const span=a=>a.length>1?Math.max(1,Math.round((new Date(a[a.length-1].t)-new Date(a[0].t))/(864e5*30.44))):0;
  return {n:f.length,T,W,dT:T.length>1?T[T.length-1].v-T[0].v:null,dW:W.length>1?W[W.length-1].v-W[0].v:null,mT:span(T),mW:span(W),firstT:T[0],firstW:W[0]};
}

      const d=new Date((e.tanggal||today())+"T00:00:00");if(withP.length<=6||i%2===0||last)g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="var(--muted)" font-family="Nunito Sans,system-ui">${d.getDate()}/${d.getMonth()+1}</text>`});
    h+=g+`</svg><p class="hint">Pace = waktu per km. Garis makin <b>tinggi</b> di grafik berarti makin cepat (sumbu dibalik). Bandingkan sesi dengan jarak yang mirip.</p>`;

async function submitEntry(ev){ev.preventDefault();

    if(!parseSets(e.skor).length){showMsg("Tulis skor seperti 15-21, 18-21 (angka anak lebih dulu).",true);return}}
  else if(type==="train"){Object.assign(e,{mood:val("f-mood"),fokus:val("f-fokus"),catatan:val("f-catatan")});if(!e.fokus&&!e.catatan&&!pending.length){showMsg("Isi fokus latihan atau catatan dulu.",true);return}}

    if(be&&(be<10||be>150)){showMsg("Berat badan tidak wajar. Tulis dalam kg, mis. 35,2.",true);return}
    Object.assign(e,{tinggi:ti?Math.round(ti*10)/10:0,berat:be?Math.round(be*10)/10:0,catatan:val("f-catatan")})}
  else if(type==="run"){const k=num(val("f-jarak")),t=parseDur(val("f-waktu"));
    if(!(k>0)||k>50){showMsg("Isi jarak dalam km, mis. 2 atau 1,5.",true);return}
    if(val("f-waktu")&&!t){showMsg("Tulis waktu seperti 12:30 (menit:detik).",true);return}
    Object.assign(e,{jenislari:val("f-jenislari"),jarak:Math.round(k*100)/100,detik:t,kondisi:val("f-mood"),catatan:val("f-catatan")})}
  else if(type==="coach"){Object.assign(e,{masukan:val("f-masukan"),target:val("f-target")});if(!e.masukan){showMsg("Isi masukan pelatih dulu.",true);return}}

  catch(err){btn.disabled=false;btn.textContent=label;showMsg(errText(err),true)}
}

function lapRange(){

  else if(o.per==="lalu"){const k=shiftMonth(nowK,-1);a=k+"-01";b=end(k);label=monthLabel(k)}
  else if(o.per==="3bln"){const k=shiftMonth(nowK,-2);a=k+"-01";b=end(nowK);label=monthLabel(k)+" – "+monthLabel(nowK)}

function growTxt(g){const p=[];if(g.lt)p.push("Tinggi "+fmt1(g.lt.v)+" cm"+(g.dT!==null?" ("+sgn(g.dT).replace("−","-")+" cm di periode ini)":""));if(g.lw)p.push("Berat "+fmt1(g.lw.v)+" kg"+(g.dW!==null?" ("+sgn(g.dW).replace("−","-")+" kg di periode ini)":""));return p.join("   |   ")+(g.lt||g.lw?"  - pengukuran terakhir "+fmtDate((g.lt&&g.lw?(g.lt.t>g.lw.t?g.lt:g.lw):(g.lt||g.lw)).t):"")}

try{const v=JSON.parse(localStorage.getItem("rbt-view")||"null");if(v&&((v.name==="kid"&&v.id)||v.name==="home"||v.name==="dash"||v.name==="biaya"||v.name==="lap"))view=v}catch(e){}
render();
async function refresh(){
  try{const d=await api("ambilData",pin);if(pin&&d.peran==="tamu"){pin="";try{localStorage.removeItem("rbt-pin")}catch(e){}}applyData(d);loadErr=""}
  catch(e){ready=true;loadErr="Data tidak bisa dimuat: "+errText(e)}
  if(view.name==="kid"&&$("form")&&kids[view.id]){renderKidData();return}
  render();
}
function alertMsg(t){busy(true,t);setTimeout(()=>busy(false),3500)}
let hiddenAt=0;
document.addEventListener("visibilitychange",()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>30000)refresh()});
refresh();
function renderKidHeaderSafe(){/* profil berubah dari perangkat lain: perbarui kartu identitas tanpa mengosongkan formulir */
  const f=$("form");if(f&&f.querySelector("input:not([type=date]):not([type=file]),textarea")&&[...f.querySelectorAll("input,textarea")].some(x=>x.type!=="date"&&x.type!=="file"&&x.value))return;
  renderKid()}
})();
